<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAMOKO tcg</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛠️%3C/text%3E%3C/svg%3E">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    body { background: #0a0a0f; -webkit-tap-highlight-color: transparent;
           background-image: radial-gradient(circle at 20% 0%, #1e1b4b 0%, transparent 50%),
                             radial-gradient(circle at 80% 100%, #4c1d95 0%, transparent 50%); }
    button:not(:disabled) { transition: all .2s ease; }
    .view { animation: fadeUp .35s ease-out; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    #pack-modal, #detail-modal { transition: opacity .25s ease; }
    #pack-modal.closing, #detail-modal.closing { opacity: 0; }

    /* ---- CARTE TCG full-art ---- */
    .tcg-card {
      position: relative;
      aspect-ratio: 5 / 7;
      border-radius: 16px;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform .3s cubic-bezier(.2,.9,.3,1.2);
      cursor: pointer;
      user-select: none;
      will-change: transform;
      container-type: inline-size;
    }
    .tcg-card .tcg-bg { position: absolute; inset: 0; }

    /* Emoji ÉNORME (fallback px pour vieux navigateurs) */
    .tcg-card .tcg-emoji {
      position: absolute;
      top: 0; bottom: 22%; left: 0; right: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 90px;          /* fallback */
      font-size: 70cqw;          /* moderne */
      line-height: 1;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,.6));
      transform: translateZ(20px);
      transition: transform .3s;
    }
    .tcg-card:hover .tcg-emoji { transform: translateZ(35px) scale(1.05); }

    .tcg-card .tcg-shine {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(circle at var(--mx,50%) var(--my,50%),
                                  rgba(255,255,255,.35) 0%, transparent 45%);
      opacity: 0; transition: opacity .3s;
    }
    .tcg-card:hover .tcg-shine { opacity: 1; }

    .tcg-card .tcg-vignette {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 50% 30%, transparent 30%, rgba(0,0,0,.4) 100%),
        linear-gradient(180deg, transparent 60%, rgba(0,0,0,.9) 100%);
      pointer-events: none;
    }
    .tcg-card .tcg-footer {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 10px 10px 12px;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,.95));
      text-align: center;
    }

    /* TEXTE ÉNORME */
    .tcg-card .tcg-name {
      font-weight: 900;
      font-size: 14px;                              /* fallback */
      font-size: clamp(12px, 8cqw, 22px);           /* moderne */
      text-shadow: 0 2px 6px rgba(0,0,0,.9);
      line-height: 1.15;
      letter-spacing: 0.01em;
    }
    .tcg-card .tcg-rarity {
      font-size: 11px;                              /* fallback */
      font-size: clamp(9px, 5cqw, 15px);            /* moderne */
      letter-spacing: .15em; text-transform: uppercase;
      margin-top: 4px; font-weight: 800;
    }
    .tcg-card .tcg-qty {
      position: absolute; top: 8px; right: 8px;
      background: rgba(0,0,0,.8); backdrop-filter: blur(4px);
      padding: 3px 10px; border-radius: 999px;
      font-size: 12px;                              /* fallback */
      font-size: clamp(10px, 5cqw, 16px);
      font-weight: 800;
      border: 1px solid rgba(255,255,255,.2);
      z-index: 3;
    }
    .tcg-card .tcg-new {
      position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg,#fbbf24,#f59e0b);
      color: #0f172a; font-weight: 900;
      font-size: 11px;                              /* fallback */
      font-size: clamp(10px, 4cqw, 14px);
      padding: 4px 12px; border-radius: 999px;
      box-shadow: 0 0 20px rgba(251,191,36,.7);
      z-index: 5;
      white-space: nowrap;
      animation: badgePop .5s cubic-bezier(.2,1.6,.4,1) both;
    }
    @keyframes badgePop { from{transform:translateX(-50%) scale(0) rotate(-20deg)} to{transform:translateX(-50%) scale(1) rotate(0)} }

    /* Raretés */
    .tcg-card.rarity-common     { box-shadow: 0 0 0 2px #94a3b8, 0 8px 30px -10px rgba(148,163,184,.5); }
    .tcg-card.rarity-uncommon   { box-shadow: 0 0 0 2px #22c55e, 0 8px 30px -8px rgba(34,197,94,.6); }
    .tcg-card.rarity-rare       { box-shadow: 0 0 0 2px #3b82f6, 0 8px 40px -8px rgba(59,130,246,.7); }
    .tcg-card.rarity-epic       { box-shadow: 0 0 0 2px #a855f7, 0 8px 50px -8px rgba(168,85,247,.8); }
    .tcg-card.rarity-legendary  { box-shadow: 0 0 0 2px #fbbf24, 0 0 60px -5px rgba(251,191,36,.9),
                                             0 8px 40px -6px rgba(251,191,36,.7); }
    .tcg-card.rarity-legendary .tcg-bg { animation: holoShift 4s linear infinite; background-size: 200% 200%; }
    @keyframes holoShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

    /* ---- ANIMATION D'OUVERTURE ---- */
    .reveal-stage {
      position: relative; width: 100%; height: 440px;
      display: flex; align-items: center; justify-content: center;
    }
    .reveal-pack {
      font-size: 170px;
      animation: packIdle 1.2s ease-in-out infinite;
      filter: drop-shadow(0 0 40px rgba(139,92,246,.7));
      z-index: 10;
      position: relative;
    }
    @keyframes packIdle {
      0%,100% { transform: scale(1) rotate(-3deg); }
      50%     { transform: scale(1.08) rotate(3deg); }
    }
    .reveal-pack.charging { animation: packShake .1s ease-in-out infinite; }
    @keyframes packShake {
      0%,100% { transform: translate(0,0) rotate(0) scale(1.15); }
      25%     { transform: translate(-9px,4px) rotate(-8deg) scale(1.22); }
      75%     { transform: translate(9px,-4px) rotate(8deg) scale(1.22); }
    }
    .reveal-pack.burst { animation: packBurst .45s ease-out forwards; }
    @keyframes packBurst {
      0%   { transform: scale(1.2); opacity: 1; filter: brightness(1); }
      40%  { transform: scale(2.5); opacity: 1; filter: brightness(3.5); }
      100% { transform: scale(4); opacity: 0; filter: brightness(6); }
    }

    /* Fan de mini-cards derrière le pack */
    .reveal-fan {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 200px; height: 200px;
      pointer-events: none;
    }
    .reveal-mini {
      position: absolute; top: 50%; left: 50%;
      width: 64px; height: 90px;
      background: repeating-linear-gradient(45deg, #1e293b 0 10px, #334155 10px 20px);
      border: 2px solid #475569;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
      transform-origin: center;
      transform: translate(-50%, -50%) rotate(calc(var(--i) * 18deg - 36deg)) translateY(-30px) scale(0.3);
      opacity: 0;
      transition: all 0.5s cubic-bezier(.2,1.6,.4,1);
    }
    .reveal-fan.visible .reveal-mini {
      opacity: 0.85;
      transform: translate(-50%, -50%) rotate(calc(var(--i) * 18deg - 36deg)) translateY(-30px) scale(1);
      transition-delay: calc(var(--i) * 60ms);
    }
    .reveal-fan.charging .reveal-mini {
      animation: miniShake .12s ease-in-out infinite;
    }
    @keyframes miniShake {
      0%,100% { transform: translate(-50%, -50%) rotate(calc(var(--i) * 18deg - 36deg)) translateY(-30px) scale(1); }
      50%     { transform: translate(-50%, -50%) rotate(calc(var(--i) * 18deg - 36deg + 5deg)) translateY(-38px) scale(1.02); }
    }
    .reveal-fan.burst .reveal-mini {
      opacity: 0;
      transform: translate(-50%, -50%) rotate(calc(var(--i) * 72deg)) translateY(-350px) scale(0.4);
      transition-delay: calc(var(--i) * 30ms);
    }

    .reveal-flash {
      position: absolute; top: 50%; left: 50%;
      width: 200px; height: 200px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, #fff 0%, transparent 70%);
      border-radius: 50%;
      opacity: 0; pointer-events: none;
    }
    .reveal-flash.active { animation: flashOut .6s ease-out; }
    @keyframes flashOut {
      0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.5); }
      30%  { opacity: 1; transform: translate(-50%,-50%) scale(1.5); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(6); }
    }

    /* ---- Cartes du reveal : flip 3D individuel ---- */
    .reveal-slot {
      perspective: 1200px;
      aspect-ratio: 5 / 7;
      position: relative;
      container-type: inline-size;
    }
    .reveal-slot-inner {
      position: relative; width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(.4,.1,.2,1);
      transform: rotateY(180deg);
    }
    .reveal-slot.flipped .reveal-slot-inner { transform: rotateY(0deg); }
    .reveal-back {
      position: absolute; inset: 0;
      background: repeating-linear-gradient(45deg, #1e293b 0 10px, #334155 10px 20px);
      border-radius: 16px;
      border: 2px solid #475569;
      display: flex; align-items: center; justify-content: center;
      font-size: 60px;
      font-size: 32cqw;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: rotateY(180deg);
      box-shadow: 0 8px 30px -10px rgba(139,92,246,.5);
    }
    .reveal-front {
      position: absolute; inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .reveal-slot.pre-charge {
      animation: preShake .15s ease-in-out 3;
    }
    @keyframes preShake {
      0%,100% { transform: translateX(0); }
      25%     { transform: translateX(-5px) rotate(-1deg); }
      75%     { transform: translateX(5px) rotate(1deg); }
    }

    body.shake { animation: screenShake .35s ease-out; }
    @keyframes screenShake {
      0%,100%{transform:translate(0,0)} 20%{transform:translate(-5px,4px)}
      40%{transform:translate(5px,-4px)} 60%{transform:translate(-4px,-3px)}
      80%{transform:translate(4px,3px)}
    }

    #btn-daily.ready { animation: dailyPulse 1.5s ease-in-out infinite; }
    @keyframes dailyPulse {
      0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.7)}
      50%{box-shadow:0 0 0 8px rgba(16,185,129,0)}
    }

    .pack-tile { transition: all .25s cubic-bezier(.4,0,.2,1); }
    .pack-tile:hover { transform: translateY(-4px);
                       box-shadow: 0 20px 40px -10px rgba(139,92,246,.5); }

    #toast { animation: toastIn .25s ease-out; }
    @keyframes toastIn { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }

    .admin-tab { transition: all .15s; }
    .admin-tab.active { background: #4f46e5; }
    .admin-tab:not(.active):hover { background: rgba(255,255,255,.05); }

    .free-badge { animation: freeGlow 2s ease-in-out infinite; }
    @keyframes freeGlow {
      0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,.5); }
      50%     { box-shadow: 0 0 0 4px rgba(16,185,129,0); }
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 font-sans">

<!-- AUTH -->
<div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-slate-800/70 backdrop-blur-xl rounded-2xl p-8 w-full max-w-md space-y-4 shadow-2xl border border-white/10">

<!-- APP -->
<div id="main-app" class="hidden">
  <header class="bg-slate-900/70 backdrop-blur-xl px-6 py-3 flex justify-between items-center flex-wrap gap-2 sticky top-0 z-20 border-b border-white/5">

<!-- MODAL PACK -->
<div id="pack-modal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 z-40 overflow-auto">
  <div id="pack-modal-content" class="max-w-6xl w-full"></div>
</div>

<!-- MODAL DETAIL -->
<div id="detail-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-40"
     onclick="if(event.target===this)closeDetail()">
  <div id="detail-modal-content"></div>
</div>

<div id="toast" class="fixed bottom-4 right-4 hidden px-4 py-3 rounded-lg shadow-lg z-50 font-semibold"></div>

<script>
// ============================================================
const SUPABASE_URL      = 'https://ktapitfayxaxslaexvgq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0YXBpdGZheXhheHNsYWV4dmdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4MTQ2ODYsImV4cCI6MjExMDM5MDY4Nn0.EumQomIvDrT3U56SMHdy0hRpo2iHeXtxTAh5GxUMrAA';

const { createClient } = window.supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let profile = null;
let adminTab = 'users';
let packStatuses = {};

const $ = id => document.getElementById(id);
const show = id => $(id).classList.remove('hidden');
const hide = id => $(id).classList.add('hidden');
const sleep = ms => new Promise(r => setTimeout(r, ms));

const ROLE_COLORS = { admin:'bg-red-600', super_modo:'bg-orange-500', modo:'bg-blue-500', user:'bg-slate-600' };

const RARITY_STYLE = {
  common:    { accent:'#94a3b8', name:'Commune',     bg:['#64748b','#334155'] },
  uncommon:  { accent:'#22c55e', name:'Peu commune', bg:['#22c55e','#14532d'] },
  rare:      { accent:'#3b82f6', name:'Rare',        bg:['#3b82f6','#1e3a8a'] },
  epic:      { accent:'#a855f7', name:'Épique',      bg:['#a855f7','#581c87'] },
  legendary: { accent:'#fbbf24', name:'Légendaire',  bg:['#fbbf24','#7c2d12'] }
};
const SELL_PRICE = { common: 30, uncommon: 75, rare: 200, epic: 600, legendary: 2000 };

function toast(msg, type='info') {
  const el = $('toast');
  el.textContent = msg;
  el.className = `fixed bottom-4 right-4 px-4 py-3 rounded-lg shadow-lg z-50 font-semibold ${
    type==='error'?'bg-red-600':type==='success'?'bg-emerald-600':'bg-slate-700'}`;
  show('toast');
  clearTimeout(el._t);
  el._t = setTimeout(()=>hide('toast'), 3500);
}

function cardBg(card) {
  const r = card.rarity || 'common';
  const pal = (RARITY_STYLE[r] || RARITY_STYLE.common).bg;
  const seed = card.art_seed || 0;
  const x1 = 20 + (seed % 60);
  const y1 = 15 + ((seed>>3) % 50);
  const x2 = 40 + ((seed>>6) % 50);
  const y2 = 50 + ((seed>>9) % 40);
  return `radial-gradient(circle at ${x1}% ${y1}%, ${pal[0]}dd 0%, transparent 55%),
          radial-gradient(circle at ${x2}% ${y2}%, ${pal[1]}ee 0%, transparent 55%),
          linear-gradient(145deg, ${pal[1]} 0%, #0a0a0f 100%)`;
}

function cardHTML(card, opts = {}) {
  const rarity = card.rarity;
  const st = RARITY_STYLE[rarity] || RARITY_STYLE.common;
  const name = card.card_name || card.name;
  const emoji = card.emoji || '❔';
  const qty = opts.qty;
  const isNew = opts.isNew;

  return `
    <div class="tcg-card rarity-${rarity}" data-name="${name}" data-rarity="${rarity}">
      <div class="tcg-bg" style="background:${cardBg(card)}"></div>
      <div class="tcg-shine"></div>
      <div class="tcg-emoji">${emoji}</div>
      <div class="tcg-vignette"></div>
      ${qty ? `<div class="tcg-qty">×${qty}</div>` : ''}
      ${isNew ? '<div class="tcg-new">✨ NOUVELLE</div>' : ''}
      <div class="tcg-footer">
        <div class="tcg-name">${name}</div>
        <div class="tcg-rarity" style="color:${st.accent}">${st.name}</div>
      </div>
    </div>`;
}

function attachTilt(el) {
  const inner = el.querySelector('.tcg-emoji');
  el.addEventListener('mousemove', (e) => {
    const r = el.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width;
    const y = (e.clientY - r.top) / r.height;
    const rx = (0.5 - y) * 22;
    const ry = (x - 0.5) * 22;
    el.style.transform = `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg) scale(1.05)`;
    el.style.setProperty('--mx', `${x*100}%`);
    el.style.setProperty('--my', `${y*100}%`);
    if (inner) inner.style.transform = `translateZ(35px) scale(1.06) translate(${(x-0.5)*10}px, ${(y-0.5)*10}px)`;
  });
  el.addEventListener('mouseleave', () => {
    el.style.transform = '';
    if (inner) inner.style.transform = '';
  });
}
function tiltAll(root) {
  root.querySelectorAll('.tcg-card').forEach(attachTilt);
}

// ============================================================
// AUTH
// ============================================================
async function signUp() {
  const email = $('email').value.trim();
  const password = $('password').value;
  const username = $('username').value.trim();
  if (!email || !password || !username) return toast('Remplis tous les champs','error');
  const { error } = await sb.auth.signUp({ email, password, options: { data: { username } } });
  if (error) return toast(error.message,'error');
  toast('Compte créé ! Vérifie tes emails.','success');
}
async function signIn() {
  const { error } = await sb.auth.signInWithPassword({
    email: $('email').value.trim(), password: $('password').value });
  if (error) return toast(error.message,'error');
}
async function signOut() { await sb.auth.signOut(); }

// ============================================================
// PROFIL
// ============================================================
async function loadProfile() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return null;
  const { data } = await sb.from('profiles').select('*').eq('id', user.id).single();
  return data;
}
async function refreshProfile() {
  profile = await loadProfile();
  if (!profile) return;
  $('user-badge').textContent = profile.username;
  $('gold-display').textContent = profile.gold;
  const rb = $('role-badge');
  rb.textContent = profile.role;
  rb.className = `text-xs px-2 py-0.5 rounded font-semibold ${ROLE_COLORS[profile.role]}`;
  const adminBtn = document.querySelector('[data-view="admin"]');
  if (['admin','super_modo','modo'].includes(profile.role)) adminBtn.classList.remove('hidden');
  else adminBtn.classList.add('hidden');
}

// ============================================================
// DAILY
// ============================================================
async function refreshDaily() {
  const { data } = await sb.rpc('get_daily_status');
  if (!data?.[0]) return;
  const btn = $('btn-daily');
  if (data[0].can_claim) {
    btn.textContent = '🎁 +500 or'; btn.disabled = false;
    btn.className = 'text-sm bg-emerald-600 hover:bg-emerald-500 px-3 py-1 rounded-lg font-semibold ready';
  } else {
    const h = Math.floor(data[0].hours_left);
    const m = Math.floor((data[0].hours_left - h) * 60);

// ============================================================
// 🎬 ANIMATION D'OUVERTURE CINÉMATIQUE
// ============================================================
async function showReveal(cards) {
  const container = $('pack-modal-content');
  const isMobile = window.innerWidth < 768;
  const gridCols = isMobile ? 'grid-cols-2' : 'grid-cols-5';
  const totalBonus = cards.reduce((s,c) => s + (c.bonus_gold||0), 0);
  const wasFree = cards[0]?.was_free;

  // ---------- PHASE 1 : Pack + fan de cartes qui apparaissent ----------
  container.innerHTML = `
    <div class="reveal-stage">
      <div class="reveal-fan" id="reveal-fan">
        ${[0,1,2,3,4].map(i => `<div class="reveal-mini" style="--i:${i}">🎴</div>`).join('')}
      </div>
      <div class="reveal-pack" id="reveal-pack">🎴</div>
      <div class="reveal-flash" id="reveal-flash"></div>
    </div>`;
  show('pack-modal');

  // Apparition du fan
  await sleep(50);
  $('reveal-fan').classList.add('visible');
  await sleep(750);

  // ---------- PHASE 2 : Charge (shake) ----------
  $('reveal-pack').classList.add('charging');
  $('reveal-fan').classList.add('charging');
  await sleep(700);

  // ---------- PHASE 3 : Burst ----------
  $('reveal-pack').classList.remove('charging');
  $('reveal-pack').classList.add('burst');
  $('reveal-fan').classList.remove('charging');
  $('reveal-fan').classList.add('burst');
  $('reveal-flash').classList.add('active');
  document.body.classList.add('shake');
  setTimeout(() => document.body.classList.remove('shake'), 400);
  await sleep(450);

  // ---------- PHASE 4 : Grille de cartes face cachée ----------
  container.innerHTML = `
    <div class="flex flex-col items-center gap-4">
      <div class="text-center">
        ${wasFree ? '<span class="bg-emerald-600 px-3 py-1 rounded-full text-xs font-bold">🎁 PACK GRATUIT</span>' : ''}
        <h2 class="text-2xl font-bold mt-2">Tu as obtenu ${cards.length} cartes !</h2>
      </div>
      <div class="grid ${gridCols} gap-3 w-full max-w-5xl px-2">
        ${cards.map((c,i) => `
          <div class="reveal-slot" data-slot="${i}" data-rarity="${c.rarity}">
            <div class="reveal-slot-inner">
              <div class="reveal-back">🎴</div>
              <div class="reveal-front">${cardHTML(c, { isNew: c.is_new })}</div>
            </div>
          </div>`).join('')}
      </div>
      <div id="reveal-footer" class="opacity-0 text-center space-y-2 mt-2 transition-opacity duration-500">
        ${totalBonus > 0 ? `<p class="text-emerald-400 font-bold text-lg">+${totalBonus} or bonus total !</p>` : ''}
        <button id="close-reveal" class="bg-indigo-600 hover:bg-indigo-500 px-8 py-2.5 rounded-lg font-semibold
                                       hover:scale-[1.03] active:scale-[0.97]">Continuer</button>
      </div>
    </div>`;

  // ---------- PHASE 5 : Flip séquentiel avec effets par carte ----------
  const rarityOrder = { common:0, uncommon:1, rare:2, epic:3, legendary:4 };
  let bestRarity = 'common';
  const slots = document.querySelectorAll('.reveal-slot');

  for (let i = 0; i < slots.length; i++) {
    const slot = slots[i];
    const rarity = cards[i].rarity;
    const isSpecial = rarity === 'epic' || rarity === 'legendary';

    // Pré-charge (petit shake) pour épique/légendaire
    if (isSpecial) {
      slot.classList.add('pre-charge');
      await sleep(280);
      slot.classList.remove('pre-charge');
    }

    // Flip !
    slot.classList.add('flipped');
    if (rarityOrder[rarity] > rarityOrder[bestRarity]) bestRarity = rarity;

    // Confetti localisé sur la carte pour épique/légendaire
    if (isSpecial) {
      const rect = slot.getBoundingClientRect();
      const x = (rect.left + rect.width/2) / window.innerWidth;
      const y = (rect.top + rect.height/2) / window.innerHeight;
      confetti({
        particleCount: rarity === 'legendary' ? 70 : 30,
        spread: rarity === 'legendary' ? 110 : 65,
        origin: { x, y },
        colors: rarity === 'legendary'
          ? ['#fbbf24','#f59e0b','#fde68a','#fff']
          : ['#a855f7','#c084fc','#e9d5ff']
      });
      if (rarity === 'legendary') {
        document.body.classList.add('shake');
        setTimeout(() => document.body.classList.remove('shake'), 400);
      }
    }

    await sleep(isSpecial ? 450 : 280);
  }

  // ---------- PHASE 6 : Tilt après tous les flips ----------
  tiltAll($('pack-modal-content'));

  // Confetti global si légendaire dans le lot
  if (bestRarity === 'legendary') {
    setTimeout(() => {
      confetti({ particleCount: 200, spread: 140, origin:{y:0.6}, colors:['#fbbf24','#f59e0b','#fff'] });
    }, 200);
  }

  await sleep(400);
  $('reveal-footer').classList.remove('opacity-0');
  $('close-reveal').onclick = closeReveal;
}

async function closeReveal() {
  const m = $('pack-modal');
  m.classList.add('closing');
  await sleep(200);
  m.classList.remove('closing');
  hide('pack-modal');
  $('pack-modal-content').innerHTML = '';
  await refreshProfile();
  await renderPacks();
  await renderCollection();
  await refreshDaily();
}

                    <option value="super_modo">super_modo</option>
                    <option value="admin">admin</option>
                  </select>
                  <button class="grant-gold bg-amber-700 hover:bg-amber-600 px-2 py-1 rounded text-xs"
                          data-user="${u.id}" data-username="${u.username}">+or</button>
                  <button class="grant-card bg-purple-700 hover:bg-purple-600 px-2 py-1 rounded text-xs"
                          data-user="${u.id}" data-username="${u.username}">+carte</button>` : ''}
                ${canBan && u.id !== profile.id ? `
                  <button class="ban-btn bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-xs"
                          data-user="${u.id}" data-banned="${u.banned}">
                    ${u.banned ? 'Débannir' : 'Bannir'}
                  </button>` : ''}
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  $('admin-search')?.addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('.admin-row').forEach(r => {
      r.style.display = r.dataset.search.includes(q) ? '' : 'none';
    });
  });
  document.querySelectorAll('.role-select').forEach(s => s.onchange = () => setRole(s.dataset.user, s.value));
  document.querySelectorAll('.ban-btn').forEach(b => b.onclick = () => toggleBan(b.dataset.user, b.dataset.banned === 'true'));
  document.querySelectorAll('.grant-gold').forEach(b => b.onclick = () => grantGold(b.dataset.user, b.dataset.username));
  document.querySelectorAll('.grant-card').forEach(b => b.onclick = () => grantCard(b.dataset.user, b.dataset.username));
}

async function renderAdminCards(content) {
  content.innerHTML = '<div class="text-slate-400">Chargement…</div>';
  const [{ data: total }, { data: cards }] = await Promise.all([
    sb.rpc('admin_cards_count'),
    sb.rpc('admin_list_cards', { p_limit: 60, p_offset: 0 })
  ]);
  content.innerHTML = `
    <div class="bg-slate-800/60 rounded-xl p-4 mb-4 border border-white/10 flex justify-between items-center flex-wrap gap-3">
      <div>
        <div class="text-xs text-slate-400 uppercase">Cartes générées</div>
        <div class="text-3xl font-bold">${total}</div>
      </div>
      <div class="flex gap-2 items-center">
        <input id="gen-count" type="number" value="10" min="1" max="100"
               class="w-20 p-2 rounded-lg bg-slate-900 border border-white/10 focus:outline-none">
        <button id="gen-cards" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg font-semibold text-sm">🎲 Générer</button>
      </div>
    </div>
    <p class="text-xs text-slate-500 mb-3">⚠️ Génère par petites quantités (10-20) pour économiser le stockage.</p>
    <div class="bg-slate-800/60 rounded-xl p-4 border border-white/10">
      <h3 class="font-bold text-sm mb-2">60 dernières cartes</h3>
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2 max-h-96 overflow-y-auto">
        ${(cards || []).map(c => `
          <div class="bg-slate-900/60 rounded-lg p-2 text-xs border border-white/5">
            <div class="text-3xl text-center">${c.emoji}</div>
            <div class="font-semibold truncate mt-1">${c.name}</div>
            <div class="text-[10px]" style="color:${RARITY_STYLE[c.rarity].accent}">${RARITY_STYLE[c.rarity].name}</div>
          </div>`).join('')}
      </div>
    </div>`;
  $('gen-cards').onclick = async () => {
    const n = parseInt($('gen-count').value) || 10;
    if (n < 1 || n > 100) return toast('Entre 1 et 100','error');
    $('gen-cards').disabled = true;
    $('gen-cards').textContent = 'Génération…';
    const { data, error } = await sb.rpc('admin_generate_cards', { p_count: n });
    if (error) return toast(error.message,'error');
    toast(`✨ ${data} cartes générées`,'success');
    await renderAdminCards(content);
  };
}

async function renderAdminPacks(content) {
  content.innerHTML = '<div class="text-slate-400">Chargement…</div>';
  const { data: packs, error } = await sb.rpc('admin_list_packs');
  if (error) return toast(error.message,'error');
  content.innerHTML = `
    <div class="space-y-3">
      ${packs.map(p => `
        <div class="bg-slate-800/60 rounded-xl p-4 border border-white/10">
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold">${p.name}</h3>
            <label class="flex items-center gap-2 text-xs">
              <input type="checkbox" data-id="${p.id}" data-field="active" ${p.is_active?'checked':''}
                     class="pack-edit w-4 h-4"> Actif
            </label>
          </div>
          <div class="grid grid-cols-2 gap-2 mb-3">
            <div>
              <label class="text-xs text-slate-400">Prix (or)</label>
              <input type="number" data-id="${p.id}" data-field="price" value="${p.price}"
                     class="pack-edit w-full p-2 rounded-lg bg-slate-900 border border-white/10 text-sm">
            </div>
            <div>
              <label class="text-xs text-slate-400">Gratuits/heure</label>
              <input type="number" data-id="${p.id}" data-field="free" value="${p.free_per_hour}"
                     class="pack-edit w-full p-2 rounded-lg bg-slate-900 border border-white/10 text-sm">
            </div>
          </div>
          <details class="mb-3">
            <summary class="text-xs text-slate-400 cursor-pointer">Poids de rareté</summary>
            <div class="grid grid-cols-5 gap-1 mt-2">
              ${Object.entries(p.rarity_weights).map(([r,w]) => `
                <div>
                  <label class="text-[10px]" style="color:${RARITY_STYLE[r].accent}">${r}</label>
                  <input type="number" step="0.1" data-id="${p.id}" data-rarity="${r}"
                         class="pack-weight w-full p-1 rounded bg-slate-900 border border-white/10 text-xs"
                         value="${w}">
                </div>`).join('')}
            </div>
          </details>
          <button data-id="${p.id}" class="save-pack bg-emerald-600 hover:bg-emerald-500 w-full py-1.5 rounded-lg text-sm font-semibold">💾 Enregistrer</button>
        </div>`).join('')}
    </div>`;
  document.querySelectorAll('.save-pack').forEach(b => {
    b.onclick = async () => {
      const id = b.dataset.id;
      const price = parseInt(document.querySelector(`input[data-id="${id}"][data-field="price"]`).value);
      const free = parseInt(document.querySelector(`input[data-id="${id}"][data-field="free"]`).value);
      const active = document.querySelector(`input[data-id="${id}"][data-field="active"]`).checked;
      const weights = {};
      document.querySelectorAll(`input[data-id="${id}"][data-rarity]`).forEach(i => {
        weights[i.dataset.rarity] = parseFloat(i.value);
      });
      const { error } = await sb.rpc('admin_update_pack', {
        p_id: id, p_price: price, p_free_per_hour: free, p_weights: weights, p_active: active
      });
      if (error) return toast(error.message,'error');
      toast('Pack mis à jour','success');
      await loadPackStatuses();
    };
  });
}

async function renderAdminLogs(content) {
  content.innerHTML = '<div class="text-slate-400">Chargement…</div>';
  const { data: logs, error } = await sb.rpc('admin_list_logs', { p_filter: null, p_limit: 200 });
  if (error) return toast(error.message,'error');
  const actions = [...new Set((logs || []).map(l => l.action))];
  content.innerHTML = `
    <div class="bg-slate-800/60 rounded-xl p-4 border border-white/10">
      <div class="flex justify-between items-center mb-3 flex-wrap gap-2">
        <h3 class="font-bold text-sm">📜 Journal (${logs?.length || 0})</h3>
        <select id="log-filter" class="bg-slate-900 p-2 rounded-lg border border-white/10 text-sm">
          <option value="">Toutes les actions</option>
          ${actions.map(a => `<option value="${a}">${a}</option>`).join('')}
        </select>
      </div>
      <div class="space-y-1 max-h-[600px] overflow-y-auto text-xs">
        ${(logs || []).map(l => `
          <div class="log-row flex justify-between gap-2 py-1.5 border-b border-slate-700/30" data-action="${l.action}">
            <span><b class="text-indigo-300">${l.actor}</b> — <span class="text-slate-300">${l.action}</span></span>
            <span class="text-slate-400">${new Date(l.at).toLocaleString('fr-FR')}</span>
          </div>`).join('')}
      </div>
    </div>`;
  $('log-filter').addEventListener('change', e => {
    const v = e.target.value;
    document.querySelectorAll('.log-row').forEach(r => {
      r.style.display = !v || r.dataset.action === v ? '' : 'none';
    });
  });
}

async function setRole(userId, role) {
  if (!role) return;
  if (!confirm(`Changer le rôle en "${role}" ?`)) return;
  const { error } = await sb.rpc('set_user_role', { p_user_id: userId, p_role: role });
  if (error) return toast(error.message,'error');
  toast('Rôle mis à jour','success');
  await renderAdmin();
}
async function toggleBan(userId, banned) {
  const { error } = await sb.rpc('set_user_banned', { p_user_id: userId, p_banned: !banned });
  if (error) return toast(error.message,'error');
  toast(banned ? 'Débanni' : 'Banni','success');
  await renderAdmin();
}
async function grantGold(userId, username) {
  const n = prompt(`Combien d'or pour ${username} ? (négatif pour retirer)`);
  if (!n) return;
  const { error } = await sb.rpc('admin_grant_gold', { p_user_id: userId, p_amount: parseInt(n) });
  if (error) return toast(error.message,'error');
  toast('Or mis à jour','success');
  await renderAdmin();
}
async function grantCard(userId, username) {
  const r = prompt(`Rareté pour ${username} ?\n(common / uncommon / rare / epic / legendary)`);
  if (!r) return;
  const { error } = await sb.rpc('admin_grant_card', { p_user_id: userId, p_rarity: r.toLowerCase() });
  if (error) return toast(error.message,'error');
  toast('Carte donnée','success');
}

// ============================================================
// NAV & bootstrap
// ============================================================
function bindNav() {
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.remove('bg-indigo-600');
        if (b.dataset.view !== 'packs') b.classList.add('hover:bg-slate-700');
      });
      $(`view-${btn.dataset.view}`).classList.remove('hidden');
      btn.classList.add('bg-indigo-600');
      btn.classList.remove('hover:bg-slate-700');
      if (btn.dataset.view === 'packs') renderPacks();
      if (btn.dataset.view === 'collection') renderCollection();
      if (btn.dataset.view === 'friends') renderFriends();
      if (btn.dataset.view === 'admin') renderAdmin();
    };
  });
}

async function enterApp() {
  await refreshProfile();
  if (!profile) return;
  show('main-app'); hide('auth-screen');
  await refreshDaily();
  await renderPacks();
  await renderCollection();
  if (['admin','super_modo','modo'].includes(profile.role)) await renderAdmin();
}
function leaveApp() { profile = null; hide('main-app'); show('auth-screen'); }

// Compte à rebours live
setInterval(async () => {
  if (!profile || $('view-packs').classList.contains('hidden')) return;
  await loadPackStatuses();
  document.querySelectorAll('.pack-tile').forEach(tile => {
    const btn = tile.querySelector('.open-pack-btn');
    if (!btn) return;
    const st = packStatuses[btn.dataset.pack];
    if (!st) return;
    const badge = tile.querySelector('.free-badge, span.bg-slate-700');
    if (st.free_remaining > 0 && badge && !badge.classList.contains('free-badge')) {
      renderPacks();
    } else if (!st.free_remaining && badge) {
      const min = Math.floor(st.seconds_left / 60);
      const sec = st.seconds_left % 60;
      if (badge.textContent.includes('⏳')) {
        badge.textContent = `⏳ ${min}m${sec.toString().padStart(2,'0')}s`;
      }
    }
  });
}, 1000);

document.addEventListener('DOMContentLoaded', async () => {
  $('btn-login').onclick = signIn;
  $('btn-signup').onclick = signUp;
  $('btn-logout').onclick = signOut;
  $('btn-daily').onclick = claimDaily;
  bindNav();
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (!$('detail-modal').classList.contains('hidden')) closeDetail();
      else if ($('close-reveal')) $('close-reveal').click();
    }
  });
  const { data: { session } } = await sb.auth.getSession();
  if (session) await enterApp();
  sb.auth.onAuthStateChange((_e, s) => { if (s) enterApp(); else leaveApp(); });
});
</script>
