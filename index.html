<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAMOKO tcg</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛠️%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body {
      background: #09090e;
      background-image:
        radial-gradient(circle at 15% -10%, rgba(99,102,241,.15), transparent 40%),
        radial-gradient(circle at 85% 110%, rgba(168,85,247,.12), transparent 40%);
      -webkit-tap-highlight-color: transparent;
      color: #e5e7eb;
    }
    button:not(:disabled) { transition: all .2s cubic-bezier(.4,0,.2,1); }
    button:disabled { cursor: not-allowed; }

    /* ---- Views ---- */
    .view { animation: fadeUp .4s cubic-bezier(.4,0,.2,1); }
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

    /* ---- Modals ---- */
    #pack-modal, #detail-modal { transition: opacity .3s ease; }
    #pack-modal.closing, #detail-modal.closing { opacity: 0; }

    /* ---- CARTE TCG ---- */
    .tcg-card {
      position: relative;
      aspect-ratio: 5 / 7;
      border-radius: 18px;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform .35s cubic-bezier(.2,.9,.3,1.2), box-shadow .3s;
      cursor: pointer;
      user-select: none;
      will-change: transform;
      container-type: inline-size;
    }
    .tcg-card .tcg-bg { position: absolute; inset: 0; }
    .tcg-card .tcg-emoji {
      position: absolute;
      top: 0; bottom: 22%; left: 0; right: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 90px;
      font-size: 70cqw;
      line-height: 1;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,.7));
      transform: translateZ(20px);
      transition: transform .35s;
    }
    .tcg-card:hover .tcg-emoji { transform: translateZ(40px) scale(1.06); }
    .tcg-card .tcg-shine {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(circle at var(--mx,50%) var(--my,50%),
                                  rgba(255,255,255,.4) 0%, transparent 45%);
      opacity: 0; transition: opacity .3s;
    }
    .tcg-card:hover .tcg-shine { opacity: 1; }
    .tcg-card .tcg-vignette {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 50% 30%, transparent 35%, rgba(0,0,0,.45) 100%),
        linear-gradient(180deg, transparent 55%, rgba(0,0,0,.95) 100%);
      pointer-events: none;
    }
    .tcg-card .tcg-footer {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 12px 10px 14px;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,.95));
      text-align: center;
    }
    .tcg-card .tcg-name {
      font-weight: 900;
      font-size: 14px;
      font-size: clamp(12px, 8cqw, 24px);
      text-shadow: 0 2px 8px rgba(0,0,0,.95);
      line-height: 1.15;
    }
    .tcg-card .tcg-rarity {
      font-size: 11px;
      font-size: clamp(9px, 5cqw, 15px);
      letter-spacing: .18em; text-transform: uppercase;
      margin-top: 5px; font-weight: 800;
    }
    .tcg-card .tcg-qty {
      position: absolute; top: 10px; right: 10px;
      background: rgba(0,0,0,.85); backdrop-filter: blur(6px);
      padding: 3px 10px; border-radius: 999px;
      font-size: 12px;
      font-size: clamp(10px, 5cqw, 16px);
      font-weight: 800;
      border: 1px solid rgba(255,255,255,.2);
      z-index: 3;
    }
    .tcg-card .tcg-new {
      position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg,#fbbf24,#f59e0b);
      color: #0f172a; font-weight: 900;
      font-size: 11px;
      font-size: clamp(10px, 4cqw, 14px);
      padding: 4px 12px; border-radius: 999px;
      box-shadow: 0 0 20px rgba(251,191,36,.7);
      z-index: 5; white-space: nowrap;
      animation: badgePop .5s cubic-bezier(.2,1.6,.4,1) both;
    }
    @keyframes badgePop { from{transform:translateX(-50%) scale(0) rotate(-20deg)} to{transform:translateX(-50%) scale(1) rotate(0)} }

    /* Raretés */
    .tcg-card.rarity-common     { box-shadow: 0 0 0 2px #94a3b8, 0 8px 30px -10px rgba(148,163,184,.5); }
    .tcg-card.rarity-uncommon   { box-shadow: 0 0 0 2px #22c55e, 0 8px 30px -8px rgba(34,197,94,.6); }
    .tcg-card.rarity-rare       { box-shadow: 0 0 0 2px #3b82f6, 0 8px 40px -8px rgba(59,130,246,.7); }
    .tcg-card.rarity-epic       { box-shadow: 0 0 0 2px #a855f7, 0 8px 50px -8px rgba(168,85,247,.8); }
    .tcg-card.rarity-legendary  { box-shadow: 0 0 0 2px #fbbf24, 0 0 60px -5px rgba(251,191,36,.9),
                                             0 8px 40px -6px rgba(251,191,36,.7); }
    .tcg-card.rarity-legendary .tcg-bg { animation: holoShift 4s linear infinite; background-size: 200% 200%; }
    @keyframes holoShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

    /* ============================================================
       ANIMATION GACHA
       ============================================================ */
    .gacha-stage {
      position: relative;
      width: 100%;
      display: flex; align-items: center; justify-content: center;
      min-height: 420px;
    }
    .gacha-pack {
      font-size: 170px;
      filter: drop-shadow(0 0 50px rgba(139,92,246,.8));
      animation: packIdle 1.3s ease-in-out infinite;
      z-index: 5;
    }
    @keyframes packIdle {
      0%,100% { transform: scale(1) rotate(-4deg); }
      50%     { transform: scale(1.1) rotate(4deg); }
    }
    .gacha-pack.charging { animation: packShake .09s ease-in-out infinite; }
    @keyframes packShake {
      0%,100% { transform: translate(0,0) rotate(0) scale(1.15); }
      25%     { transform: translate(-10px,5px) rotate(-8deg) scale(1.25); }
      75%     { transform: translate(10px,-5px) rotate(8deg) scale(1.25); }
    }
    .gacha-pack.burst { animation: packBurst .5s ease-out forwards; }
    @keyframes packBurst {
      0%   { transform: scale(1.2); opacity: 1; filter: brightness(1); }
      40%  { transform: scale(2.5); opacity: 1; filter: brightness(4); }
      100% { transform: scale(4); opacity: 0; filter: brightness(8); }
    }
    .gacha-flash-fullscreen {
      position: fixed; inset: 0;
      background: #fff; pointer-events: none;
      opacity: 0; z-index: 100;
    }
    .gacha-flash-fullscreen.fire { animation: fullFlash .4s ease-out; }
    @keyframes fullFlash {
      0% { opacity: 0; } 25% { opacity: .8; } 100% { opacity: 0; }
    }

    /* GRILLE RÉVÉLATION */
    .gacha-grid {
      display: grid; gap: 14px;
      max-width: 1000px; width: 100%;
      padding: 0 8px;
      perspective: 2000px;
    }
    .gacha-slot {
      position: relative;
      aspect-ratio: 5 / 7;
      container-type: inline-size;
      perspective: 1400px;
    }
    .gacha-slot-inner {
      position: relative; width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform .8s cubic-bezier(.4,.1,.2,1);
      transform: rotateY(180deg);
    }
    .gacha-slot.flipped .gacha-slot-inner { transform: rotateY(0deg); }
    .gacha-back {
      position: absolute; inset: 0;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      transform: rotateY(180deg);
      border-radius: 16px;
      background:
        radial-gradient(circle at 50% 30%, rgba(139,92,246,.3), transparent 60%),
        repeating-linear-gradient(45deg, #1e293b 0 10px, #334155 10px 20px);
      border: 2px solid #475569;
      display: flex; align-items: center; justify-content: center;
      font-size: 32cqw;
      box-shadow: inset 0 0 40px rgba(139,92,246,.3);
    }
    .gacha-front {
      position: absolute; inset: 0;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
    }

    /* Aura de charge (pulse autour de la carte) */
    .gacha-slot.charging::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 22px;
      background: radial-gradient(circle, var(--rarity-color) 0%, transparent 70%);
      filter: blur(20px);
      opacity: 0.8;
      animation: auraPulse .4s ease-in-out infinite;
      z-index: -1;
    }
    @keyframes auraPulse {
      0%,100% { opacity: 0.6; transform: scale(0.95); }
      50%     { opacity: 1; transform: scale(1.05); }
    }

    /* Faisceau de lumière */
    .gacha-beam {
      position: absolute;
      left: 50%;
      bottom: 50%;
      transform: translateX(-50%);
      width: 55%;
      height: 0;
      background: linear-gradient(to top,
        var(--beam-color) 0%,
        #fff 40%,
        var(--beam-color) 70%,
        transparent 100%);
      border-radius: 50%;
      filter: blur(6px);
      box-shadow: 0 0 40px 12px var(--beam-color);
      pointer-events: none;
      z-index: 20;
      opacity: 0;
    }
    .gacha-beam.fire { animation: beamFire .8s cubic-bezier(.2,0,.4,1) forwards; }
    @keyframes beamFire {
      0%   { height: 0; opacity: 0; }
      15%  { opacity: 1; }
      70%  { height: 450px; opacity: 1; }
      100% { height: 600px; opacity: 0; }
    }
    .gacha-beam.fire.big { animation-duration: 1s; }

    /* Flash local sur la carte */
    .gacha-flash {
      position: absolute; inset: 0;
      background: radial-gradient(circle, #fff 0%, transparent 70%);
      border-radius: 16px;
      opacity: 0;
      pointer-events: none;
      z-index: 15;
    }
    .gacha-flash.fire { animation: localFlash .45s ease-out; }
    @keyframes localFlash {
      0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; }
    }

    /* Impact après flip */
    .gacha-slot.impact { animation: cardImpact .4s ease-out; }
    @keyframes cardImpact {
      0% { transform: scale(1); }
      35% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    body.shake { animation: screenShake .4s ease-out; }
    @keyframes screenShake {
      0%,100%{transform:translate(0,0)} 20%{transform:translate(-6px,4px)}
      40%{transform:translate(6px,-4px)} 60%{transform:translate(-4px,-3px)}
      80%{transform:translate(4px,3px)}
    }

    /* ---- Pack tiles ---- */
    .pack-tile {
      transition: all .3s cubic-bezier(.4,0,.2,1);
      background: linear-gradient(145deg, rgba(30,30,50,.7), rgba(15,15,25,.7));
    }
    .pack-tile:hover {
      transform: translateY(-6px);
      box-shadow: 0 25px 50px -15px rgba(139,92,246,.6);
      border-color: rgba(139,92,246,.5);
    }

    /* ---- Misc ---- */
    #btn-daily.ready { animation: dailyPulse 1.5s ease-in-out infinite; }
    @keyframes dailyPulse {
      0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.7)}
      50%{box-shadow:0 0 0 10px rgba(16,185,129,0)}
    }
    #toast { animation: toastIn .3s cubic-bezier(.4,0,.2,1); }
    @keyframes toastIn { from{transform:translateY(30px);opacity:0} to{transform:translateY(0);opacity:1} }
    .admin-tab { transition: all .2s; }
    .admin-tab.active { background: linear-gradient(135deg, #6366f1, #8b5cf6); box-shadow: 0 4px 20px rgba(99,102,241,.4); }
    .admin-tab:not(.active):hover { background: rgba(255,255,255,.06); }
    .free-badge { animation: freeGlow 2s ease-in-out infinite; }
    @keyframes freeGlow {
      0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,.6); }
      50%     { box-shadow: 0 0 0 6px rgba(16,185,129,0); }
    }

    /* Nav pill */
    .nav-btn { border-radius: 999px; }
    .nav-btn.active {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      box-shadow: 0 4px 20px rgba(99,102,241,.4);
    }
    .nav-btn:not(.active):hover { background: rgba(255,255,255,.06); }
  </style>
</head>

<script>
// ============================================================
const SUPABASE_URL      = 'https://ktapitfayxaxslaexvgq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0YXBpdGZheXhheHNsYWV4dmdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4MTQ2ODYsImV4cCI6MjExMDM5MDY4Nn0.EumQomIvDrT3U56SMHdy0hRpo2iHeXtxTAh5GxUMrAA';

const { createClient } = window.supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let profile = null;
let adminTab = 'users';
let packStatuses = {};

const $ = id => document.getElementById(id);
const show = id => $(id).classList.remove('hidden');
const hide = id => $(id).classList.add('hidden');
const sleep = ms => new Promise(r => setTimeout(r, ms));

const ROLE_COLORS = { admin:'bg-red-600', super_modo:'bg-orange-500', modo:'bg-blue-500', user:'bg-slate-600' };
const RARITY_STYLE = {
  common:    { accent:'#94a3b8', name:'Commune',     bg:['#64748b','#334155'] },
  uncommon:  { accent:'#22c55e', name:'Peu commune', bg:['#22c55e','#14532d'] },
  rare:      { accent:'#3b82f6', name:'Rare',        bg:['#3b82f6','#1e3a8a'] },
  epic:      { accent:'#a855f7', name:'Épique',      bg:['#a855f7','#581c87'] },
  legendary: { accent:'#fbbf24', name:'Légendaire',  bg:['#fbbf24','#7c2d12'] }
};
const SELL_PRICE = { common: 10, uncommon: 25, rare: 75, epic: 200, legendary: 600 };

function toast(msg, type='info') {
  const el = $('toast');
  el.textContent = msg;
  el.className = `fixed bottom-6 right-6 px-5 py-3 rounded-xl shadow-2xl z-50 font-bold ${
    type==='error'?'bg-red-600':type==='success'?'bg-emerald-600':'bg-slate-800'}`;
  show('toast');
  clearTimeout(el._t);
  el._t = setTimeout(()=>hide('toast'), 3500);
}

function cardBg(card) {
  const pal = (RARITY_STYLE[card.rarity] || RARITY_STYLE.common).bg;
  const seed = card.art_seed || 0;
  const x1 = 20 + (seed % 60);
  const y1 = 15 + ((seed>>3) % 50);
  const x2 = 40 + ((seed>>6) % 50);
  const y2 = 50 + ((seed>>9) % 40);
  return `radial-gradient(circle at ${x1}% ${y1}%, ${pal[0]}dd 0%, transparent 55%),
          radial-gradient(circle at ${x2}% ${y2}%, ${pal[1]}ee 0%, transparent 55%),
          linear-gradient(145deg, ${pal[1]} 0%, #0a0a0f 100%)`;
}

function cardHTML(card, opts = {}) {
  const rarity = card.rarity;
  const st = RARITY_STYLE[rarity] || RARITY_STYLE.common;
  const name = card.card_name || card.name;
  const emoji = card.emoji || '❔';
  return `
    <div class="tcg-card rarity-${rarity}">
      <div class="tcg-bg" style="background:${cardBg(card)}"></div>
      <div class="tcg-shine"></div>
      <div class="tcg-emoji">${emoji}</div>
      <div class="tcg-vignette"></div>
      ${opts.qty ? `<div class="tcg-qty">×${opts.qty}</div>` : ''}
      ${opts.isNew ? '<div class="tcg-new">✨ NOUVELLE</div>' : ''}
      <div class="tcg-footer">
        <div class="tcg-name">${name}</div>
        <div class="tcg-rarity" style="color:${st.accent}">${st.name}</div>
      </div>
    </div>`;
}

function attachTilt(el) {
  const inner = el.querySelector('.tcg-emoji');
  el.addEventListener('mousemove', (e) => {
    const r = el.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width;
    const y = (e.clientY - r.top) / r.height;
    el.style.transform = `perspective(900px) rotateX(${(0.5-y)*22}deg) rotateY(${(x-0.5)*22}deg) scale(1.05)`;
    el.style.setProperty('--mx', `${x*100}%`);
    el.style.setProperty('--my', `${y*100}%`);
    if (inner) inner.style.transform = `translateZ(40px) scale(1.06) translate(${(x-0.5)*10}px, ${(y-0.5)*10}px)`;
  });
  el.addEventListener('mouseleave', () => {
    el.style.transform = '';
    if (inner) inner.style.transform = '';
  });
}
function tiltAll(root) { root.querySelectorAll('.tcg-card').forEach(attachTilt); }

// ============================================================
// AUTH
// ============================================================
async function signUp() {
  const email = $('email').value.trim();
  const password = $('password').value;
  const username = $('username').value.trim();
  if (!email || !password || !username) return toast('Remplis tous les champs','error');
  const { error } = await sb.auth.signUp({ email, password, options: { data: { username } } });
  if (error) return toast(error.message,'error');
  toast('Compte créé ! Vérifie tes emails.','success');
}
async function signIn() {
  const { error } = await sb.auth.signInWithPassword({
    email: $('email').value.trim(), password: $('password').value });
  if (error) return toast(error.message,'error');
}
async function signOut() { await sb.auth.signOut(); }

// ============================================================
// PROFIL
// ============================================================
async function loadProfile() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return null;
  const { data } = await sb.from('profiles').select('*').eq('id', user.id).single();
  return data;
}
async function refreshProfile() {
  profile = await loadProfile();
  if (!profile) return;
  $('user-badge').textContent = profile.username;
  $('gold-display').textContent = profile.gold;
  const rb = $('role-badge');
  rb.textContent = profile.role;
  rb.className = `text-xs px-2 py-0.5 rounded-full font-bold ${ROLE_COLORS[profile.role]}`;
  const adminBtn = document.querySelector('[data-view="admin"]');
  if (['admin','super_modo','modo'].includes(profile.role)) adminBtn.classList.remove('hidden');
  else adminBtn.classList.add('hidden');
}

// ============================================================
// DAILY
// ============================================================
async function refreshDaily() {
  const { data } = await sb.rpc('get_daily_status');
  if (!data?.[0]) return;
  const btn = $('btn-daily');
  if (data[0].can_claim) {
    btn.textContent = '🎁 +500'; btn.disabled = false;
    btn.className = 'text-sm bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-full font-bold ready';
  } else {
    const h = Math.floor(data[0].hours_left);
    const m = Math.floor((data[0].hours_left - h) * 60);
    btn.textContent = `🎁 ${h}h${m.toString().padStart(2,'0')}m`; btn.disabled = true;
    btn.className = 'text-sm bg-slate-800 px-3 py-1.5 rounded-full font-bold opacity-60';
  }
}
async function claimDaily() {
  const { data, error } = await sb.rpc('claim_daily_bonus');
  if (error) return toast(error.message,'error');
  toast(`🎁 +${data[0].gold_earned} or !`,'success');
  confetti({ particleCount: 80, spread: 80, origin: {y:0.7}, colors:['#10b981','#34d399','#6ee7b7'] });
  await refreshProfile(); await refreshDaily(); await renderPacks();
}

async function loadPackStatuses() {
  const { data } = await sb.rpc('get_pack_status');
  packStatuses = {};
  (data || []).forEach(s => packStatuses[s.pack_id] = s);
}
async function renderPacks() {
  const c = $('view-packs');
  c.innerHTML = '<div class="text-slate-400">Chargement…</div>';
  const { data: packs, error } = await sb.from('packs').select('*').eq('is_active', true).order('price');
  if (error) return toast(error.message,'error');
  await loadPackStatuses();

  c.innerHTML = `
    <div class="mb-6">
      <h2 class="text-2xl font-black mb-1">Packs</h2>
      <p class="text-slate-400 text-sm">5 cartes par pack · Les packs gratuits se rechargent toutes les heures</p>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      ${packs.map(p => {
        const st = packStatuses[p.id] || { free_remaining: 0, free_per_hour: p.free_per_hour, seconds_left: 0 };
        const hasFree = st.free_remaining > 0;
        const canOpen = hasFree || profile.gold >= p.price;
        const min = Math.floor(st.seconds_left / 60);
        const sec = st.seconds_left % 60;
        return `
          <div class="pack-tile rounded-2xl p-6 border-2 border-slate-700/60">
            <div class="flex justify-between items-start mb-4">
              <div class="text-7xl drop-shadow-2xl">🎴</div>
              ${hasFree ? `
                <span class="free-badge bg-emerald-600 text-white text-sm font-black px-4 py-1.5 rounded-full">
                  🎁 ${st.free_remaining}/${st.free_per_hour}
                </span>` : `
                <span class="bg-slate-800 text-slate-300 text-xs font-bold px-4 py-1.5 rounded-full">
                  ⏳ ${min}m${sec.toString().padStart(2,'0')}s
                </span>`}
            </div>
            <h3 class="font-black text-2xl mb-1">${p.name}</h3>
            <p class="text-slate-400 text-sm mb-4">
              ${hasFree
                ? `<span class="text-emerald-400 font-bold">Gratuit disponible</span> · sinon ${p.price} or`
                : `${p.price} or · ${p.free_per_hour} gratuits/heure`}
            </p>
            <div class="text-xs mb-4 flex flex-wrap gap-1.5">
              ${Object.entries(p.rarity_weights).map(([r,w]) => {
                const rst = RARITY_STYLE[r];
                return `<span class="px-2.5 py-1 rounded-full font-bold"
                              style="background:${rst.accent}22;color:${rst.accent};border:1px solid ${rst.accent}55">
                          ${r}: ${w}%</span>`;
              }).join('')}
            </div>
            <button class="open-pack-btn w-full ${hasFree ? 'bg-emerald-600 hover:bg-emerald-500' : 'bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500'}
                           p-3.5 rounded-xl font-black text-base disabled:opacity-40 disabled:cursor-not-allowed
                           hover:scale-[1.02] active:scale-[0.98]"
                    data-pack="${p.id}" ${!canOpen ? 'disabled' : ''}>
              ${hasFree ? '🎁 Ouvrir gratuitement' : `Ouvrir · ${p.price} or`}
            </button>
          </div>`;
      }).join('')}
    </div>`;
  document.querySelectorAll('.open-pack-btn').forEach(b => b.onclick = () => openPack(b.dataset.pack, b));
}

async function openPack(packId, btn) {
  btn.disabled = true;
  const orig = btn.textContent;
  btn.textContent = '✨ Ouverture…';
  const { data, error } = await sb.rpc('open_pack', { p_pack_id: packId });
  if (error) { btn.disabled = false; btn.textContent = orig; return toast(error.message,'error'); }
  showGachaReveal(data);
}

// ============================================================
// 🎬 ANIMATION GACHA (style Genshin)
// ============================================================
async function showGachaReveal(cards) {
  const container = $('pack-modal-content');
  const totalBonus = cards.reduce((s,c) => s + (c.bonus_gold||0), 0);
  const wasFree = cards[0]?.was_free;

  // ---- Phase 1 : pack qui shake ----
  container.innerHTML = `
    <div class="gacha-stage">
      <div class="gacha-pack" id="gacha-pack">🎴</div>
    </div>`;
  show('pack-modal');
  const pack = $('gacha-pack');

  await sleep(600);
  pack.classList.add('charging');
  await sleep(700);
  pack.classList.remove('charging');
  pack.classList.add('burst');

  // Flash fullscreen
  const fullFlash = document.createElement('div');
  fullFlash.className = 'gacha-flash-fullscreen fire';
  document.body.appendChild(fullFlash);
  document.body.classList.add('shake');
  setTimeout(() => document.body.classList.remove('shake'), 400);
  setTimeout(() => fullFlash.remove(), 500);

  await sleep(500);

  // ---- Phase 2 : grille face cachée ----
  const isMobile = window.innerWidth < 768;
  const gridCols = isMobile ? 'grid-cols-2' : 'grid-cols-5';

  container.innerHTML = `
    <div class="flex flex-col items-center gap-5">
      <div class="text-center">
        ${wasFree ? '<span class="bg-emerald-600 px-3 py-1 rounded-full text-xs font-black">🎁 PACK GRATUIT</span>' : ''}
        <h2 class="text-2xl font-black mt-2">${cards.length} cartes obtenues</h2>
      </div>
      <div class="gacha-grid ${gridCols}">
        ${cards.map((c,i) => `
          <div class="gacha-slot" data-slot="${i}" style="--rarity-color:${RARITY_STYLE[c.rarity].accent}">
            <div class="gacha-beam"></div>
            <div class="gacha-flash"></div>
            <div class="gacha-slot-inner">
              <div class="gacha-back">🎴</div>
              <div class="gacha-front">${cardHTML(c, { isNew: c.is_new })}</div>
            </div>
          </div>`).join('')}
      </div>
      <div id="reveal-footer" class="opacity-0 text-center space-y-2 mt-2 transition-opacity duration-500">
        ${totalBonus > 0 ? `<p class="text-emerald-400 font-bold text-lg">+${totalBonus} or bonus</p>` : ''}
        <button id="close-reveal" class="bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 px-10 py-3 rounded-xl font-black text-base hover:scale-[1.03] active:scale-[0.97]">
          Continuer
        </button>
      </div>
    </div>`;

  await sleep(300);

  // ---- Phase 3 : révélation séquentielle style gacha ----
  const slots = document.querySelectorAll('.gacha-slot');
  const rarityOrder = { common:0, uncommon:1, rare:2, epic:3, legendary:4 };
  let bestRarity = 'common';

  for (let i = 0; i < slots.length; i++) {
    const slot = slots[i];
    const card = cards[i];
    const rarity = card.rarity;
    const color = RARITY_STYLE[rarity].accent;
    const rarityVal = rarityOrder[rarity];
    if (rarityVal > rarityOrder[bestRarity]) bestRarity = rarity;

    await revealSlot(slot, card, color, rarity);
    await sleep(rarity === 'legendary' ? 400 : rarity === 'epic' ? 250 : 120);
  }

  tiltAll($('pack-modal-content'));

  // Confetti global légendaire
  if (bestRarity === 'legendary') {
    confetti({ particleCount: 250, spread: 160, origin:{y:0.6}, colors:['#fbbf24','#f59e0b','#fff'] });
  } else if (bestRarity === 'epic') {
    confetti({ particleCount: 120, spread: 100, origin:{y:0.6}, colors:['#a855f7','#c084fc','#e9d5ff'] });
  }

  await sleep(400);
  $('reveal-footer').classList.remove('opacity-0');
  $('close-reveal').onclick = closeReveal;
}

// Révélation d'une carte façon gacha
async function revealSlot(slot, card, color, rarity) {
  const beam = slot.querySelector('.gacha-beam');
  const flash = slot.querySelector('.gacha-flash');

  // 1. Charge : aura pulse
  slot.classList.add('charging');
  const chargeTime = { common: 150, uncommon: 200, rare: 250, epic: 350, legendary: 500 }[rarity];
  await sleep(chargeTime);

  // 2. Faisceau(x) de lumière
  if (rarity === 'legendary') {
    // Faisceau violet d'abord (faux espoir)
    beam.style.setProperty('--beam-color', '#a855f7');
    beam.classList.remove('fire');
    void beam.offsetWidth;
    beam.classList.add('fire');
    await sleep(450);

    // Flash + shake + upgrade doré
    document.body.classList.add('shake');
    setTimeout(() => document.body.classList.remove('shake'), 400);
    beam.classList.remove('fire');
    void beam.offsetWidth;
    beam.style.setProperty('--beam-color', '#fbbf24');
    beam.classList.add('fire', 'big');
    await sleep(500);
  } else if (rarity === 'epic') {
    beam.style.setProperty('--beam-color', '#a855f7');
    beam.classList.remove('fire'); void beam.offsetWidth;
    beam.classList.add('fire');
    await sleep(400);
  } else {
    beam.style.setProperty('--beam-color', color);
    beam.classList.remove('fire'); void beam.offsetWidth;
    beam.classList.add('fire');
    await sleep(300);
  }

  // 3. Flash local + flip
  flash.classList.remove('fire'); void flash.offsetWidth;
  flash.classList.add('fire');
  slot.classList.remove('charging');
  slot.classList.add('flipped');
  await sleep(100);
  slot.classList.add('impact');

  // 4. Confetti localisé pour épique+
  if (rarity === 'epic' || rarity === 'legendary') {
    const rect = slot.getBoundingClientRect();
    confetti({
      particleCount: rarity === 'legendary' ? 90 : 40,
      spread: rarity === 'legendary' ? 130 : 80,
      origin: {
        x: (rect.left + rect.width/2) / window.innerWidth,
        y: (rect.top + rect.height/2) / window.innerHeight
      },
      colors: rarity === 'legendary'
        ? ['#fbbf24','#f59e0b','#fde68a','#fff']
        : ['#a855f7','#c084fc','#e9d5ff']
    });
  }

  await sleep(450);
  slot.classList.remove('impact');
}

async function closeReveal() {
  const m = $('pack-modal');
  m.classList.add('closing');
  await sleep(250);
  m.classList.remove('closing');
  hide('pack-modal');
  $('pack-modal-content').innerHTML = '';
  await refreshProfile();
  await renderPacks();
  await renderCollection();
  await refreshDaily();
}

// COLLECTION

async function renderCollection() {
  const c = $('view-collection');
  c.innerHTML = '<div class="text-slate-400">Chargement…</div>';
  const { data, error } = await sb.from('collection_items')
    .select('card_id, quantity, cards(id, name, rarity, word_a, word_b, art_seed, accent_color, emoji)')
    .order('acquired_at', { ascending: false });
  if (error) return toast(error.message,'error');
  if (!data.length) { c.innerHTML = '<p class="text-slate-400">Collection vide. Ouvre un pack !</p>'; return; }

  const total = data.reduce((s,i)=>s+i.quantity,0);
  const dupCount = data.reduce((s,i)=>s+Math.max(0,i.quantity-1),0);
  const byRarity = {};
  data.forEach(i => { (byRarity[i.cards.rarity] ||= []).push(i); });
  const order = ['legendary','epic','rare','uncommon','common'];

  c.innerHTML = `
    <div class="flex justify-between items-center mb-5 flex-wrap gap-3">
      <div>
        <h2 class="text-2xl font-black">Collection</h2>
        <p class="text-slate-400 text-sm">${total} cartes · ${data.length} uniques · ${dupCount} doublons</p>
      </div>
      ${dupCount > 0 ? `
        <button id="sell-all-dup" class="bg-amber-600 hover:bg-amber-500 px-4 py-2 rounded-xl font-bold text-sm hover:scale-[1.02] active:scale-[0.98]">
          💰 Vendre ${dupCount} doublon${dupCount > 1 ? 's' : ''}
        </button>` : ''}
    </div>
    ${order.filter(r => byRarity[r]).map(r => `
      <h3 class="text-sm font-black uppercase tracking-wider mb-3 mt-6 flex items-center gap-2" style="color:${RARITY_STYLE[r].accent}">
        <span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${RARITY_STYLE[r].accent}"></span>
        ${RARITY_STYLE[r].name} (${byRarity[r].reduce((s,i)=>s+i.quantity,0)})
      </h3>
      <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-7 gap-3 mb-2">
        ${byRarity[r].map(i => `
          <div class="cursor-pointer" onclick="showCardDetail('${i.card_id}')">
            ${cardHTML({
              card_name: i.cards.name, name: i.cards.name,
              rarity: i.cards.rarity, emoji: i.cards.emoji,
              art_seed: i.cards.art_seed, accent_color: i.cards.accent_color
            }, { qty: i.quantity })}
          </div>`).join('')}
      </div>
    `).join('')}`;
  tiltAll(c);

  window.__collectionMap = {};
  data.forEach(i => {
    window.__collectionMap[i.card_id] = {
      card: { name: i.cards.name, rarity: i.cards.rarity, emoji: i.cards.emoji,
              art_seed: i.cards.art_seed, accent_color: i.cards.accent_color,
              word_a: i.cards.word_a, word_b: i.cards.word_b },
      qty: i.quantity
    };
  });

  if (dupCount > 0) {
    $('sell-all-dup').onclick = sellAllDuplicates;
  }
}

async function sellAllDuplicates() {
  if (!confirm('Vendre tous les doublons ? (garde 1 de chaque)')) return;
  const { data, error } = await sb.rpc('sell_all_duplicates');
  if (error) return toast(error.message,'error');
  toast(`💰 +${data[0].total_gold} or · ${data[0].cards_sold} cartes vendues`,'success');
  await refreshProfile();
  await renderCollection();
  await renderPacks();
}

function showCardDetail(cardId) {
  const info = window.__collectionMap?.[cardId];
  if (!info) return;
  const st = RARITY_STYLE[info.card.rarity];
  const sellPrice = SELL_PRICE[info.card.rarity] || 5;
  const card = { ...info.card, card_name: info.card.name };

  $('detail-modal-content').innerHTML = `
    <div class="bg-slate-900/95 rounded-2xl p-6 max-w-sm w-full border border-white/10 shadow-2xl">
      <div class="mx-auto mb-4" style="max-width:280px">${cardHTML(card)}</div>
      <h3 class="font-black text-center text-xl mb-1">${card.name}</h3>
      <p class="text-center text-sm font-bold mb-4" style="color:${st.accent}">${st.name}</p>
      <div class="text-xs text-slate-400 space-y-1.5 mb-4 bg-slate-800/60 rounded-xl p-3">
        <div class="flex justify-between"><span>Mot A</span><span class="text-slate-200 font-semibold">${card.word_a || '?'}</span></div>
        <div class="flex justify-between"><span>Mot B</span><span class="text-slate-200 font-semibold">${card.word_b || '?'}</span></div>
        <div class="flex justify-between"><span>Quantité</span><span class="text-slate-200 font-semibold">×${info.qty}</span></div>
        <div class="flex justify-between"><span>Valeur</span><span class="text-amber-400 font-semibold">${sellPrice} or</span></div>
      </div>
      <div class="flex gap-2">
        ${info.qty > 1 ? `
          <button onclick="sellDuplicate('${cardId}','${card.name.replace(/'/g,'')}',1)"
                  class="flex-1 bg-amber-600 hover:bg-amber-500 p-2.5 rounded-xl font-bold text-sm">💰 1</button>
          <button onclick="sellDuplicate('${cardId}','${card.name.replace(/'/g,'')}',${info.qty-1})"
                  class="flex-1 bg-amber-700 hover:bg-amber-600 p-2.5 rounded-xl font-bold text-sm">💰 ${info.qty-1}</button>` : ''}
        <button onclick="closeDetail()" class="flex-1 bg-slate-700 hover:bg-slate-600 p-2.5 rounded-xl font-bold text-sm">Fermer</button>
      </div>
    </div>`;
  show('detail-modal');
  tiltAll($('detail-modal-content'));
}
function closeDetail() { hide('detail-modal'); $('detail-modal-content').innerHTML = ''; }

async function sellDuplicate(cardId, name, qty = 1) {
  const { data, error } = await sb.rpc('sell_duplicate', { p_card_id: cardId, p_quantity: qty });
  if (error) return toast(error.message,'error');
  toast(`💰 +${data[0].gold_earned} or`,'success');
  await refreshProfile();
  await renderCollection();
  await renderPacks();
  if (data[0].new_quantity === 0) closeDetail();
  else if (!$('detail-modal').classList.contains('hidden')) showCardDetail(cardId);
}

        <input id="friend-input" type="text" placeholder="Pseudo…"

        <div class="space-y-2">
          ${requests.map(r => `
            <div class="flex justify-between items-center bg-slate-800/70 rounded-xl p-2.5">
              <span class="text-sm font-bold">${r.from_username}</span>
              <div class="flex gap-1">
                <button onclick="respondFriend(${r.id},true)" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg text-xs font-bold">✓</button>
                <button onclick="respondFriend(${r.id},false)" class="bg-red-600 hover:bg-red-500 px-3 py-1.5 rounded-lg text-xs font-bold">✗</button>
              </div>
            </div>`).join('')}
        </div>
      </div>` : ''}
    <div class="bg-slate-900/60 rounded-2xl p-4 border border-white/10">
      <h3 class="font-bold mb-2 text-sm text-slate-300">🎉 Mes amis (${friends?.length || 0})</h3>
      ${!friends?.length ? '<p class="text-slate-400 text-sm">Aucun ami pour le moment.</p>' : `
        <div class="space-y-2">
          ${friends.map(f => `
            <div class="flex justify-between items-center bg-slate-800/70 rounded-xl p-2.5">
              <div class="flex items-center gap-2">
                <span class="text-sm font-bold">${f.username}</span>
                <span class="text-xs px-1.5 py-0.5 rounded-full font-bold ${ROLE_COLORS[f.role]}">${f.role}</span>
                <span class="text-xs text-slate-400">💰 ${f.gold}</span>
              </div>
              <button onclick="removeFriend('${f.friend_id}')" class="bg-red-700 hover:bg-red-600 px-2.5 py-1 rounded-lg text-xs font-bold">Retirer</button>
            </div>`).join('')}
        </div>`}
    </div>`;
  $('friend-send').onclick = sendFriendRequest;
  $('friend-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendFriendRequest(); });
}
async function sendFriendRequest() {
  const name = $('friend-input').value.trim();
  if (!name) return;
  const { data, error } = await sb.rpc('friend_request', { p_username: name });
  if (error) return toast(error.message,'error');
  toast(data || 'Demande envoyée','success');
  $('friend-input').value = '';
  await renderFriends();
}
async function respondFriend(id, accept) {
  const { error } = await sb.rpc('friend_respond', { p_id: id, p_accept: accept });
  if (error) return toast(error.message,'error');
  toast(accept ? 'Ami ajouté !' : 'Refusé','success');
  await renderFriends();
}
async function removeFriend(friendId) {
  if (!confirm('Retirer cet ami ?')) return;
  const { error } = await sb.rpc('friend_remove', { p_other: friendId });
  if (error) return toast(error.message,'error');
  toast('Retiré','success');
  await renderFriends();
}

      <button data-tab="packs" class="admin-tab px-4 py-2 rounded-xl text-sm font-bold ${adminTab==='packs'?'active':''}">📦 Packs</button>
      <button data-tab="logs"  class="admin-tab px-4 py-2 rounded-xl text-sm font-bold ${adminTab==='logs'?'active':''}">📜 Logs</button>
    </div>
    <div id="admin-content"></div>`;
  document.querySelectorAll('.admin-tab').forEach(b => {
    b.onclick = () => { adminTab = b.dataset.tab; renderAdmin(); };
  });
  const content = $('admin-content');
  if (adminTab === 'users') await renderAdminUsers(content);
  else if (adminTab === 'cards') await renderAdminCards(content);
  else if (adminTab === 'packs') await renderAdminPacks(content);
  else if (adminTab === 'logs') await renderAdminLogs(content);
}

async function renderAdminUsers(content) {
  content.innerHTML = '<div class="text-slate-400">Chargement…</div>';
  const [{ data: users }, { data: stats }] = await Promise.all([
    sb.from('profiles').select('id, username, role, gold, banned, created_at').order('created_at', { ascending: false }),
    sb.rpc('admin_stats')
  ]);
  const isAdmin = profile.role === 'admin';
  const canBan = ['admin','super_modo'].includes(profile.role);
  const s = stats?.[0];

  content.innerHTML = `
    ${s ? `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
      <div class="bg-slate-900/60 rounded-xl p-3 border border-white/10">
        <div class="text-xs text-slate-400 uppercase font-bold">Utilisateurs</div><div class="text-2xl font-black">${s.total_users}</div>
      </div>
      <div class="bg-slate-900/60 rounded-xl p-3 border border-white/10">
        <div class="text-xs text-slate-400 uppercase font-bold">Cartes possédées</div><div class="text-2xl font-black">${s.total_cards_owned}</div>
      </div>
      <div class="bg-slate-900/60 rounded-xl p-3 border border-white/10">
        <div class="text-xs text-slate-400 uppercase font-bold">Packs ouverts</div><div class="text-2xl font-black">${s.total_packs_opened}</div>
      </div>
      <div class="bg-slate-900/60 rounded-xl p-3 border border-white/10">
        <div class="text-xs text-slate-400 uppercase font-bold">Or total</div><div class="text-2xl font-black text-amber-400">${s.total_gold}</div>
      </div>
    </div>` : ''}
    <input id="admin-search" type="text" placeholder="🔍 Rechercher…"
           class="w-full p-2.5 rounded-xl bg-slate-900 border border-white/10 mb-3 focus:outline-none focus:ring-2 ring-indigo-500">
    <div class="bg-slate-900/60 rounded-xl overflow-x-auto border border-white/10">
      <table class="w-full text-sm">
        <thead class="bg-slate-950/60">
          <tr>
            <th class="p-2 text-left">Utilisateur</th><th class="p-2 text-left">Rôle</th>
            <th class="p-2 text-left">Or</th><th class="p-2 text-left">Statut</th><th class="p-2 text-left">Actions</th>
          </tr>
        </thead>
        <tbody>
          ${users.map(u => `
            <tr class="border-t border-slate-800/60 admin-row" data-search="${u.username.toLowerCase()}">
              <td class="p-2 font-semibold">${u.username}</td>
              <td class="p-2"><span class="text-xs px-2 py-0.5 rounded-full font-bold ${ROLE_COLORS[u.role]}">${u.role}</span></td>
              <td class="p-2">${u.gold}</td>
              <td class="p-2">${u.banned
                ? '<span class="text-red-400 font-semibold">Banni</span>'
                : '<span class="text-emerald-400 font-semibold">Actif</span>'}</td>
              <td class="p-2 flex gap-1 flex-wrap">
                ${isAdmin && u.id !== profile.id ? `
                  <select data-user="${u.id}" class="role-select bg-slate-800 rounded-lg p-1 text-xs">
                    <option value="">-- rôle --</option>
                    <option value="user">user</option><option value="modo">modo</option>
                    <option value="super_modo">super_modo</option><option value="admin">admin</option>
                  </select>
                  <button class="grant-gold bg-amber-700 hover:bg-amber-600 px-2 py-1 rounded-lg text-xs font-bold" data-user="${u.id}" data-username="${u.username}">+or</button>
                  <button class="grant-card bg-purple-700 hover:bg-purple-600 px-2 py-1 rounded-lg text-xs font-bold" data-user="${u.id}" data-username="${u.username}">+carte</button>` : ''}
                ${canBan && u.id !== profile.id ? `
                  <button class="ban-btn bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded-lg text-xs font-bold" data-user="${u.id}" data-banned="${u.banned}">${u.banned ? 'Débannir' : 'Bannir'}</button>` : ''}
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  $('admin-search')?.addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('.admin-row').forEach(r => r.style.display = r.dataset.search.includes(q) ? '' : 'none');
  });
  document.querySelectorAll('.role-select').forEach(s => s.onchange = () => setRole(s.dataset.user, s.value));
  document.querySelectorAll('.ban-btn').forEach(b => b.onclick = () => toggleBan(b.dataset.user, b.dataset.banned === 'true'));
  document.querySelectorAll('.grant-gold').forEach(b => b.onclick = () => grantGold(b.dataset.user, b.dataset.username));
  document.querySelectorAll('.grant-card').forEach(b => b.onclick = () => grantCard(b.dataset.user, b.dataset.username));
}

async function renderAdminCards(content) {
  content.innerHTML = '<div class="text-slate-400">Chargement…</div>';
  const [{ data: total }, { data: cards }] = await Promise.all([
    sb.rpc('admin_cards_count'),
    sb.rpc('admin_list_cards', { p_limit: 60, p_offset: 0 })
  ]);
  content.innerHTML = `
    <div class="bg-slate-900/60 rounded-xl p-4 mb-4 border border-white/10 flex justify-between items-center flex-wrap gap-3">
      <div><div class="text-xs text-slate-400 uppercase font-bold">Cartes générées</div><div class="text-3xl font-black">${total}</div></div>
      <div class="flex gap-2 items-center">
        <input id="gen-count" type="number" value="10" min="1" max="100"
               class="w-20 p-2 rounded-lg bg-slate-800 border border-white/10">
        <button id="gen-cards" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg font-bold text-sm">🎲 Générer</button>
      </div>
    </div>
    <div class="bg-slate-900/60 rounded-xl p-4 border border-white/10">
      <h3 class="font-bold text-sm mb-2">60 dernières cartes</h3>
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2 max-h-96 overflow-y-auto">
        ${(cards || []).map(c => `
          <div class="bg-slate-800/60 rounded-lg p-2 text-xs border border-white/5">
            <div class="text-3xl text-center">${c.emoji}</div>
            <div class="font-bold truncate mt-1">${c.name}</div>
            <div class="text-[10px]" style="color:${RARITY_STYLE[c.rarity].accent}">${RARITY_STYLE[c.rarity].name}</div>
          </div>`).join('')}
      </div>
    </div>`;
  $('gen-cards').onclick = async () => {
    const n = parseInt($('gen-count').value) || 10;
    if (n < 1 || n > 100) return toast('Entre 1 et 100','error');
    $('gen-cards').disabled = true;
    $('gen-cards').textContent = 'Génération…';
    const { data, error } = await sb.rpc('admin_generate_cards', { p_count: n });
    if (error) return toast(error.message,'error');
    toast(`✨ ${data} cartes générées`,'success');
    await renderAdminCards(content);
  };
}

async function renderAdminPacks(content) {
  content.innerHTML = '<div class="text-slate-400">Chargement…</div>';
  const { data: packs, error } = await sb.rpc('admin_list_packs');
  if (error) return toast(error.message,'error');
  content.innerHTML = `
    <div class="space-y-3">
      ${packs.map(p => `
        <div class="bg-slate-900/60 rounded-xl p-4 border border-white/10">
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold">${p.name}</h3>
            <label class="flex items-center gap-2 text-xs font-bold">
              <input type="checkbox" data-id="${p.id}" data-field="active" ${p.is_active?'checked':''} class="w-4 h-4"> Actif
            </label>
          </div>
          <div class="grid grid-cols-2 gap-2 mb-3">
            <div><label class="text-xs text-slate-400 font-bold">Prix (or)</label>
              <input type="number" data-id="${p.id}" data-field="price" value="${p.price}" class="w-full p-2 rounded-lg bg-slate-800 border border-white/10 text-sm"></div>
            <div><label class="text-xs text-slate-400 font-bold">Gratuits/heure</label>
              <input type="number" data-id="${p.id}" data-field="free" value="${p.free_per_hour}" class="w-full p-2 rounded-lg bg-slate-800 border border-white/10 text-sm"></div>
          </div>
          <details class="mb-3">
            <summary class="text-xs text-slate-400 cursor-pointer font-bold">Poids de rareté</summary>
            <div class="grid grid-cols-5 gap-1 mt-2">
              ${Object.entries(p.rarity_weights).map(([r,w]) => `
                <div><label class="text-[10px] font-bold" style="color:${RARITY_STYLE[r].accent}">${r}</label>
                  <input type="number" step="0.1" data-id="${p.id}" data-rarity="${r}" value="${w}" class="w-full p-1 rounded bg-slate-800 border border-white/10 text-xs"></div>`).join('')}
            </div>
          </details>
          <button data-id="${p.id}" class="save-pack bg-emerald-600 hover:bg-emerald-500 w-full py-2 rounded-lg text-sm font-bold">💾 Enregistrer</button>
        </div>`).join('')}
    </div>`;
  document.querySelectorAll('.save-pack').forEach(b => {
    b.onclick = async () => {
      const id = b.dataset.id;
      const price = parseInt(document.querySelector(`input[data-id="${id}"][data-field="price"]`).value);
      const free = parseInt(document.querySelector(`input[data-id="${id}"][data-field="free"]`).value);
      const active = document.querySelector(`input[data-id="${id}"][data-field="active"]`).checked;
      const weights = {};
      document.querySelectorAll(`input[data-id="${id}"][data-rarity]`).forEach(i => { weights[i.dataset.rarity] = parseFloat(i.value); });
      const { error } = await sb.rpc('admin_update_pack', { p_id: id, p_price: price, p_free_per_hour: free, p_weights: weights, p_active: active });
      if (error) return toast(error.message,'error');
      toast('Pack mis à jour','success');
      await loadPackStatuses();
    };
  });
}

async function renderAdminLogs(content) {
  content.innerHTML = '<div class="text-slate-400">Chargement…</div>';
  const { data: logs, error } = await sb.rpc('admin_list_logs', { p_filter: null, p_limit: 200 });
  if (error) return toast(error.message,'error');
  const actions = [...new Set((logs || []).map(l => l.action))];
  content.innerHTML = `
    <div class="bg-slate-900/60 rounded-xl p-4 border border-white/10">
      <div class="flex justify-between items-center mb-3 flex-wrap gap-2">
        <h3 class="font-bold text-sm">📜 Journal (${logs?.length || 0})</h3>
        <select id="log-filter" class="bg-slate-800 p-2 rounded-lg border border-white/10 text-sm">
          <option value="">Toutes les actions</option>
          ${actions.map(a => `<option value="${a}">${a}</option>`).join('')}
        </select>
      </div>
      <div class="space-y-1 max-h-[600px] overflow-y-auto text-xs">
        ${(logs || []).map(l => `
          <div class="log-row flex justify-between gap-2 py-1.5 border-b border-slate-800/60" data-action="${l.action}">
            <span><b class="text-indigo-300">${l.actor}</b> — ${l.action}</span>
            <span class="text-slate-400">${new Date(l.at).toLocaleString('fr-FR')}</span>
          </div>`).join('')}
      </div>
    </div>`;
  $('log-filter').addEventListener('change', e => {
    const v = e.target.value;
    document.querySelectorAll('.log-row').forEach(r => r.style.display = !v || r.dataset.action === v ? '' : 'none');
  });
}

async function setRole(userId, role) {
  if (!role) return;
  if (!confirm(`Changer le rôle en "${role}" ?`)) return;
  const { error } = await sb.rpc('set_user_role', { p_user_id: userId, p_role: role });
  if (error) return toast(error.message,'error');
  toast('Rôle mis à jour','success');
  await renderAdmin();
}
async function toggleBan(userId, banned) {
  const { error } = await sb.rpc('set_user_banned', { p_user_id: userId, p_banned: !banned });
  if (error) return toast(error.message,'error');
  toast(banned ? 'Débanni' : 'Banni','success');
  await renderAdmin();
}
async function grantGold(userId, username) {
  const n = prompt(`Combien d'or pour ${username} ? (négatif pour retirer)`);
  if (!n) return;
  const { error } = await sb.rpc('admin_grant_gold', { p_user_id: userId, p_amount: parseInt(n) });
  if (error) return toast(error.message,'error');
  toast('Or mis à jour','success');
  await renderAdmin();
}
async function grantCard(userId, username) {
  const r = prompt(`Rareté pour ${username} ?\n(common / uncommon / rare / epic / legendary)`);
  if (!r) return;
  const { error } = await sb.rpc('admin_grant_card', { p_user_id: userId, p_rarity: r.toLowerCase() });
  if (error) return toast(error.message,'error');
  toast('Carte donnée','success');
}

// ============================================================
// NAV
// ============================================================
function bindNav() {
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.remove('active');
        if (b.dataset.view !== 'packs') b.classList.add('text-slate-300');
      });
      $(`view-${btn.dataset.view}`).classList.remove('hidden');
      btn.classList.add('active');
      btn.classList.remove('text-slate-300');
      if (btn.dataset.view === 'packs') renderPacks();
      if (btn.dataset.view === 'collection') renderCollection();
      if (btn.dataset.view === 'friends') renderFriends();
      if (btn.dataset.view === 'admin') renderAdmin();
    };
  });
}

async function enterApp() {
  await refreshProfile();
  if (!profile) return;
  show('main-app'); hide('auth-screen');
  await refreshDaily();
  await renderPacks();
  await renderCollection();
  if (['admin','super_modo','modo'].includes(profile.role)) await renderAdmin();
}
function leaveApp() { profile = null; hide('main-app'); show('auth-screen'); }

// Compte à rebours
setInterval(async () => {
  if (!profile || $('view-packs').classList.contains('hidden')) return;
  await loadPackStatuses();
  document.querySelectorAll('.pack-tile').forEach(tile => {
    const btn = tile.querySelector('.open-pack-btn');
    if (!btn) return;
    const st = packStatuses[btn.dataset.pack];
    if (!st) return;
    const badge = tile.querySelector('.free-badge, span.bg-slate-800');
    if (st.free_remaining > 0 && badge && !badge.classList.contains('free-badge')) {
      renderPacks();
    } else if (!st.free_remaining && badge) {
      const min = Math.floor(st.seconds_left / 60);
      const sec = st.seconds_left % 60;
      if (badge.textContent.includes('⏳')) badge.textContent = `⏳ ${min}m${sec.toString().padStart(2,'0')}s`;
    }
  });
}, 1000);

document.addEventListener('DOMContentLoaded', async () => {
  $('btn-login').onclick = signIn;
  $('btn-signup').onclick = signUp;
  $('btn-logout').onclick = signOut;
  $('btn-daily').onclick = claimDaily;
  bindNav();
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (!$('detail-modal').classList.contains('hidden')) closeDetail();
      else if ($('close-reveal')) $('close-reveal').click();
    }
  });
  const { data: { session } } = await sb.auth.getSession();
  if (session) await enterApp();
  sb.auth.onAuthStateChange((_e, s) => { if (s) enterApp(); else leaveApp(); });
});
</script>
